# Ledger.Repayment-7
ledger.repayment.amount.mismatch=Repayment must match the outstanding loan amount exactly
# Ledger.Repayment-9
ledger.repayment.currency.mismatch=Repayment must be in the loan's currency
# Ledger.Repayment-10
ledger.repayment.loan.notOutstanding=This loan is no longer outstanding
# Ledger.Approval-9
ledger.approval.notPending=Transaction no longer pending
# Dashboard.Net-5
dashboard.offline=Offline — showing last known state

