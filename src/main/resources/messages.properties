# Moundou's Bank - user-facing text, English (Release 1.0).
#
# ADR-014 / I18N-1: every piece of text a member sees comes from this file - screens,
# validation messages and alert emails. Templates use #{key}; nothing is written
# literally into a template or into Java code. TemplateTextTests fails the build
# on a literal, or on a #{key} that is missing here.
#
# Keys are namespaced by where the text appears: <area>.<element>[.<detail>].
# French arrives in Release 2.0 as messages_fr.properties (I18N-2); no template or
# code changes should be needed for it.
#
# Messages that take arguments are MessageFormat patterns: write a literal
# apostrophe as '' in those, and use {0,choice,...} for anything with a count,
# because French treats 0 and 1 as singular and English does not.

app.name=Moundou's Bank

# --- Messages whose exact wording the SRS specifies. Change them through change
# --- control, not here: SrsMessageTests checks each against the requirement.

# Ledger.Entry-2
ledger.entry.amount.notPositive=Amount must be greater than zero
# Ledger.Entry-3
ledger.entry.counterparty.self=Counterparty cannot be yourself
# Ledger.Entry-16
ledger.entry.openingBalance.closed=Opening balances can only be recorded during onboarding
# Ledger.Repayment-7
ledger.repayment.amount.mismatch=Repayment must match the outstanding loan amount exactly
# Ledger.Repayment-9
ledger.repayment.currency.mismatch=Repayment must be in the loan's currency
# Ledger.Repayment-10
ledger.repayment.loan.notOutstanding=This loan is no longer outstanding
# Ledger.Approval-9
ledger.approval.notPending=Transaction no longer pending
# Dashboard.Net-5
dashboard.offline=Offline — showing last known state

# --- Transaction entry (MB-11). Wording not fixed by the SRS.

ledger.entry.counterparty.required=Choose who the money was exchanged with
# Auth.Roles-4: deactivated members cannot be chosen
ledger.entry.counterparty.unavailable=That member is not available
ledger.entry.role.required=Say whether you lent or borrowed
ledger.entry.amount.required=Enter an amount
ledger.entry.amount.invalid=Enter the amount as a number, such as 12.50
# Ledger.Entry-13: finer than the currency's smallest unit, including any fraction of a CFA franc
ledger.entry.amount.tooPrecise=That amount is finer than this currency allows
ledger.entry.amount.tooLarge=That amount is too large to record
# Ledger.Entry-13
ledger.entry.currency.unsupported=Choose US dollars, CFA francs or euros
# Ledger.Entry-8: judged in the member's own time zone (Ledger.Entry-12)
ledger.entry.date.future=The date cannot be in the future
