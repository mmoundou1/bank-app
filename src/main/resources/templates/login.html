<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${#locale.language}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{signIn.title}">Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; max-width: 32rem; margin: 0 auto; padding: 1.5rem 1rem; }
    .button { display: inline-block; padding: 0.75rem 1.25rem; border: 1px solid currentColor; border-radius: 0.5rem; text-decoration: none; }
  </style>
</head>
<body>
<main>
  <h1 th:text="#{app.name}">Moundou's Bank</h1>
  <p th:if="${messageKey}" role="status" th:text="#{${messageKey}}">Message</p>
  <p><a class="button" th:href="@{/oauth2/authorization/google}" th:text="#{signIn.withGoogle}">Sign in with Google</a></p>
</main>
</body>
</html>
